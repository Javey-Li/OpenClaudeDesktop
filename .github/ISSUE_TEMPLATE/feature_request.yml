name: Feature or workflow
description: Explain a missing capability or a workflow that needs improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: User workflow and current gap
      description: Describe what you need to do and where the current implementation stops.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intended result
      description: Explain how someone can check that the workflow works.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Related requirements or references
      description: Link to the PRD, an upstream change, or observed behavior. Mark unverified details.
