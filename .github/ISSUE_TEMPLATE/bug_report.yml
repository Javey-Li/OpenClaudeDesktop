name: Bug report
description: Report a reproducible failure in the inherited or modified code.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit, source folder, OS, architecture, and relevant backend.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or UI actions and any required test input.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include the relevant error. Remove credentials and personal content.
    validations:
      required: true
